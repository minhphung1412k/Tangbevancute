<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ETERNITY: FOR VÂN ❤️</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #overlay { position: fixed; inset: 0; background: radial-gradient(circle, #0f172a, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: #fff; text-align: center; }
        .start-btn { padding: 15px 40px; background: #ef4444; border: none; color: #fff; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 20px; box-shadow: 0 0 20px #ef4444; }
        
        #ui { position: fixed; inset: 0; pointer-events: none; z-index: 100; color: #fff; display: none; }
        #hud { position: absolute; top: 20px; left: 20px; font-size: 20px; text-shadow: 2px 2px #000; color: #fbbf24; }
        #mobile-controls { position: absolute; bottom: 40px; right: 40px; display: flex; gap: 20px; pointer-events: auto; }
        .control-btn { width: 80px; height: 80px; border-radius: 50%; background: rgba(239, 68, 68, 0.5); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="letter-spacing: 5px;">HÀNH TRÌNH TÌM KÝ ỨC</h1>
        <p>Dành riêng cho Vân yêu dấu</p>
        <button class="start-btn" onclick="startGame()">KHỞI ĐẦU</button>
    </div>

    <div id="ui">
        <div id="hud">Mảnh vỡ ký ức: <span id="score">0</span>/10</div>
        <div id="mobile-controls">
            <div class="control-btn" onclick="attack()"><i class="fas fa-khanda"></i></div>
            <div class="control-btn" onclick="boost()"><i class="fas fa-wind"></i></div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, sword, monster, terrain;
        let score = 0, isLocked = false, move = {f:0, b:0, l:0, r:0};

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            init();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Bầu trời xanh lãng mạn
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.01);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 1. ÁNH SÁNG MẶT TRỜI CHÂN THỰC
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // 2. THIẾT KẾ ĐỊA HÌNH NÚI RỪNG
            createWorld();

            // 3. THIẾT KẾ KIẾM KATANA BÓNG LOÁNG
            createSword();

            // 4. THÔNG SỐ ĐIỀU KHIỂN
            document.addEventListener('keydown', (e) => handleKey(e.code, 1));
            document.addEventListener('keyup', (e) => handleKey(e.code, 0));
            
            // Xoay chuột cho PC (Laptop)
            document.addEventListener('click', () => { renderer.domElement.requestPointerLock(); });
            document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === renderer.domElement);
            window.addEventListener('mousemove', (e) => {
                if(isLocked) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                }
            });

            spawnMonster();
            animate();
        }

        function createWorld() {
            // Tạo núi nhấp nhô
            const geo = new THREE.PlaneGeometry(1000, 1000, 60, 60);
            const pos = geo.attributes.position.array;
            for(let i=0; i<pos.length; i+=3) {
                pos[i+2] = Math.sin(pos[i]/25) * Math.cos(pos[i+1]/25) * 12; // Độ cao núi
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ color: 0x34d399, roughness: 1 }); // Màu cỏ xanh mượt
            terrain = new THREE.Mesh(geo, mat);
            terrain.rotation.x = -Math.PI/2;
            terrain.receiveShadow = true;
            scene.add(terrain);

            // Thêm cây to bóng mát
            for(let i=0; i<80; i++) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 10), new THREE.MeshStandardMaterial({color: 0x4b2d0b}));
                const leaf = new THREE.Mesh(new THREE.SphereGeometry(4, 8, 8), new THREE.MeshStandardMaterial({color: 0x065f46}));
                leaf.position.y = 6;
                tree.add(trunk, leaf);
                tree.position.set(Math.random()*400-200, 4, Math.random()*400-200);
                scene.add(tree);
            }
        }

        function createSword() {
            sword = new THREE.Group();
            const blade = new THREE.Mesh(
                new THREE.BoxGeometry(0.02, 0.1, 2.5),
                new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.1 }) // Độ bóng cao
            );
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6), new THREE.MeshStandardMaterial({color: 0xef4444}));
            handle.rotation.x = Math.PI/2;
            handle.position.z = 1.4;
            sword.add(blade, handle);
            sword.position.set(0.8, -0.6, -1.5);
            camera.add(sword);
            scene.add(camera);
        }

        function spawnMonster() {
            if(monster) scene.remove(monster);
            monster = new THREE.Group();
            // Thiết kế quái vật bóng đêm thay vì cục đá
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.5, 7), new THREE.MeshBasicMaterial({color: 0x000000}));
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshBasicMaterial({color: 0x000000}));
            head.position.y = 4;
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0xff0000}));
            eye.position.set(0, 4.2, 0.8); eye.name = "EYE";
            monster.add(body, head, eye);
            monster.position.set(Math.random()*60-30, 3.5, camera.position.z - 40);
            scene.add(monster);
        }

        function handleKey(code, val) {
            if(code === 'KeyW') move.f = val; if(code === 'KeyS') move.b = val;
            if(code === 'KeyA') move.l = val; if(code === 'KeyD') move.r = val;
            if(code === 'Space' && val) attack();
        }

        function attack() {
            sword.rotation.x = -Math.PI/3;
            setTimeout(() => sword.rotation.x = 0, 150);
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(), camera);
            const hits = ray.intersectObjects(monster.children);
            if(hits.length > 0) {
                score++; document.getElementById('score').innerText = score;
                spawnMonster();
            }
        }

        function boost() {
            camera.position.addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 15);
        }

        function animate() {
            requestAnimationFrame(animate);
            const s = 0.25;
            if(move.f) camera.translateZ(-s); if(move.b) camera.translateZ(s);
            if(move.l) camera.translateX(-s); if(move.r) camera.translateX(s);

            if(camera.position.distanceTo(monster.position) < 50) {
                monster.lookAt(camera.position);
                monster.translateZ(0.12 + score*0.02);
            }
            if(camera.position.distanceTo(monster.position) < 3) location.reload();

            // Hiệu ứng thở cho camera
            camera.position.y = 4 + Math.sin(Date.now()*0.005)*0.1;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
