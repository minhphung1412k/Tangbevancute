<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ETERNITY: THE MASTERPIECE FOR VÂN ❤️</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        #loading { position: fixed; inset: 0; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; z-index: 10001; font-size: 1.2rem; letter-spacing: 5px; }
        
        /* GIAO DIỆN CHỌN THIẾT BỊ */
        #setup { position: fixed; inset: 0; background: radial-gradient(circle, #0f0c29, #302b63, #24243e); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; color: #fff; text-align: center; }
        .device-row { display: flex; gap: 40px; margin-top: 30px; }
        .card { padding: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; cursor: pointer; transition: 0.3s; width: 140px; }
        .card:hover { transform: translateY(-10px); background: #ff4757; }
        .card i { font-size: 50px; margin-bottom: 10px; }

        /* UI TRONG GAME */
        #ui { position: fixed; inset: 0; pointer-events: none; z-index: 100; color: #fff; display: none; }
        #hud { position: absolute; top: 30px; left: 30px; text-shadow: 0 0 10px #ff4757; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; }
        
        #msg { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); text-align: center; font-size: 22px; font-weight: bold; width: 80%; text-shadow: 0 0 20px #ff4757; opacity: 0; transition: 0.5s; }

        /* NÚT MOBILE ICON */
        #mobile-btns { position: absolute; bottom: 40px; right: 40px; display: flex; gap: 20px; pointer-events: auto; }
        .btn-round { width: 75px; height: 75px; border-radius: 50%; background: rgba(255, 71, 87, 0.4); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; box-shadow: 0 0 20px rgba(255, 71, 87, 0.3); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading">DỆT NÊN KÝ ỨC...</div>

    <div id="setup">
        <h1 style="letter-spacing: 5px;">THIẾT BỊ CỦA VÂN?</h1>
        <div class="device-row">
            <div class="card" onclick="start('pc')"><i class="fas fa-desktop"></i><br>LAPTOP</div>
            <div class="card" onclick="start('mobile')"><i class="fas fa-mobile-alt"></i><br>MOBILE</div>
        </div>
    </div>

    <div id="ui">
        <div id="crosshair"></div>
        <div id="hud">KÝ ỨC: <span id="count" style="font-size: 30px;">0</span> / 10</div>
        <div id="msg"></div>
        <div id="mobile-btns" class="hidden">
            <div class="btn-round" onmousedown="attack()" ontouchstart="attack()"><i class="fas fa-fire"></i></div>
            <div class="btn-round" onmousedown="swing()" ontouchstart="swing()"><i class="fas fa-link"></i></div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, monster, sword, deviceType;
        let frags = 0, isGameOver = false, isLocked = false;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        const messages = [
            "Vợ tổng tài bắt đầu săn chó rồi! =)",
            "Á đù! Chém mượt quá vậy Vân ơi!",
            "Tui yêu em, cố lên sắp lên đỉnh rồi nè!",
            "Gần một nửa đoạn đường rồi, tuyệt quá vợ yêu!",
            "Cố lên, 5 tên nữa thôi là về với anh!",
            "Má ơi vợ tui ngầu quá, mãi đỉnh!",
            "ÔNG CỐ NỘI ƠI CHÁU DÂU VIP QUÁ!",
            "Sắp tới đích rồi, đừng bỏ cuộc nha Vân!",
            "90% rồi!Cố lên nào bé iu của anh con chó cuối mạnh lắm cẩn thận đó nha!",
            "Chiến thắng rồi! Phần thưởng là ANH đây ❤️"
        ];

        function start(type) {
            deviceType = type;
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('ui').style.display = 'block';
            if(type === 'mobile') document.getElementById('mobile-btns').classList.remove('hidden');
            init();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // ÁNH SÁNG "TUYỆT PHẨM"
            const ambient = new THREE.AmbientLight(0x4040ff, 0.3); scene.add(ambient);
            const moon = new THREE.DirectionalLight(0xffffff, 1.5);
            moon.position.set(50, 100, 50);
            moon.castShadow = true;
            scene.add(moon);

            // TẠO ĐỊA HÌNH NÚI NON (Noise-based terrain)
            createTerrain();

            // TẠO KIẾM "BLACK STEEL" SÁNG BÓNG
            createMasterSword();

            // SỰ KIỆN ĐIỀU KHIỂN
            if(deviceType === 'pc') {
                document.addEventListener('click', () => renderer.domElement.requestPointerLock());
                document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === renderer.domElement);
                window.addEventListener('mousemove', (e) => {
                    if(isLocked) {
                        camera.rotation.y -= e.movementX * 0.002;
                        camera.rotation.x -= e.movementY * 0.002;
                    }
                });
                window.addEventListener('keydown', (e) => handleKey(e.code, true));
                window.addEventListener('keyup', (e) => handleKey(e.code, false));
            }

            spawnMonster();
            document.getElementById('loading').classList.add('hidden');
            animate();
        }

        function createTerrain() {
            const geo = new THREE.PlaneGeometry(1000, 1000, 100, 100);
            const vertices = geo.attributes.position.array;
            for (let i = 0; i < vertices.length; i += 3) {
                // Tạo núi nhấp nhô lãng mạn
                vertices[i + 2] = Math.sin(vertices[i] / 20) * Math.cos(vertices[i + 1] / 20) * 8;
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.8 });
            const terrain = new THREE.Mesh(geo, mat);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);

            // Thêm "Rừng cây bóng mát"
            for(let i=0; i<150; i++) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 10), new THREE.MeshStandardMaterial({color: 0x1a0a00}));
                const foliage = new THREE.Mesh(new THREE.SphereGeometry(3, 8, 8), new THREE.MeshBasicMaterial({color: 0x8a2be2, transparent: true, opacity: 0.5}));
                foliage.position.y = 6;
                tree.add(trunk, foliage);
                tree.position.set(Math.random()*400-200, 4, Math.random()*400-200);
                scene.add(tree);
            }
        }

        function createMasterSword() {
            sword = new THREE.Group();
            const bladeGeo = new THREE.BoxGeometry(0.02, 0.08, 2.2);
            const bladeMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 1, roughness: 0.1 }); // Bóng loáng kim loại
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.6), new THREE.MeshStandardMaterial({color: 0x8b0000}));
            handle.rotation.x = Math.PI/2;
            handle.position.z = 1.2;
            
            sword.add(blade, handle);
            sword.position.set(0.8, -0.6, -1.5);
            camera.add(sword);
            scene.add(camera);
        }

        function spawnMonster() {
            if(monster) scene.remove(monster);
            monster = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 0, 8), new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.8}));
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.6), new THREE.MeshBasicMaterial({color: 0xff0000}));
            eye.position.set(0, 3, 0.8); eye.name = "TIM";
            monster.add(body, eye);
            monster.position.set(Math.random()*60-30, 4, camera.position.z - 50);
            scene.add(monster);
        }

        function handleKey(code, isDown) {
            if(code === 'KeyW') moveForward = isDown;
            if(code === 'KeyS') moveBackward = isDown;
            if(code === 'KeyA') moveLeft = isDown;
            if(code === 'KeyD') moveRight = isDown;
            if(code === 'Space' && isDown) attack();
        }

        function attack() {
            if(isGameOver) return;
            sword.rotation.x = -Math.PI/3;
            setTimeout(() => sword.rotation.x = 0, 150);

            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObjects(monster.children);
            if(hits.length > 0 && hits[0].object.name === "TIM") killMonster();
        }

        function killMonster() {
            const m = document.getElementById('msg');
            m.innerText = messages[frags];
            m.style.opacity = 1;
            
            let scale = 1;
            const timer = setInterval(() => {
                scale -= 0.1;
                monster.scale.set(scale, scale, scale);
                monster.position.y += 0.5;
                if(scale <= 0) {
                    clearInterval(timer);
                    m.style.opacity = 0;
                    frags++;
                    document.getElementById('count').innerText = frags;
                    if(frags < 10) spawnMonster();
                    else alert("Vân ơi, anh yêu em hơn cả sinh mệnh này! ❤️");
                }
            }, 50);
        }

        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            // DI CHUYỂN
            const speed = 0.3;
            if(moveForward) camera.translateZ(-speed);
            if(moveBackward) camera.translateZ(speed);
            if(moveLeft) camera.translateX(-speed);
            if(moveRight) camera.translateX(speed);

            // CAMERA THỞ
            camera.position.y = 3 + Math.sin(Date.now()*0.004)*0.1;
            sword.position.y = -0.6 + Math.sin(Date.now()*0.008)*0.02;

            // QUÁI VẬT ĐUỔI THEO
            const dist = camera.position.distanceTo(monster.position);
            if(dist < 50) {
                monster.lookAt(camera.position);
                monster.translateZ(0.15 + frags*0.02);
            }
            if(dist < 5) {
                alert("Đừng sợ, anh sẽ luôn bảo vệ Vân...");
                location.reload();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
