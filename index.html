<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KIMETSU NO VÂN: MEMORY JOURNEY</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; color: white; }
        .hidden { display: none !important; }

        /* MÀN HÌNH CHỌN THIẾT BỊ */
        #setup-screen { position: fixed; inset: 0; background: radial-gradient(circle, #1a1a2e, #16213e, #0f3460); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; text-align: center; }
        .choice-container { display: flex; gap: 30px; margin-top: 30px; }
        .device-card { padding: 30px; background: rgba(255,255,255,0.1); border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.3s; width: 150px; }
        .device-card:hover { transform: scale(1.1); background: #e94560; border-color: #fff; }
        .device-card i { font-size: 50px; margin-bottom: 15px; }

        /* GIAO DIỆN LOGIN */
        #login-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 9000; }
        .login-box { padding: 40px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        input { width: 100%; padding: 12px; margin: 20px 0; border-radius: 50px; border: none; text-align: center; }
        #start-btn { padding: 12px 50px; border-radius: 50px; border: none; background: #e94560; color: #fff; font-weight: bold; cursor: pointer; }

        /* UI TRONG GAME */
        #game-ui { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.5); font-size: 20px; }
        #hud { position: absolute; top: 20px; left: 20px; font-weight: bold; color: #ff4d4d; text-shadow: 0 0 10px #ff4d4d; }
        
        /* NÚT ĐIỆN THOẠI (ẨN TRÊN PC) */
        #mobile-btns { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; pointer-events: auto; }
        .m-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(233, 69, 96, 0.5); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
        
        #msg-box { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); text-align: center; font-size: 20px; color: #fff; text-shadow: 0 0 15px #e94560; width: 80%; opacity: 0; transition: 0.5s; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>BẠN ĐANG DÙNG GÌ ĐỂ GỬI YÊU THƯƠNG?</h1>
        <div class="choice-container">
            <div class="device-card" onclick="setDevice('pc')">
                <i class="fas fa-laptop"></i><br>LAPTOP / PC
            </div>
            <div class="device-card" onclick="setDevice('mobile')">
                <i class="fas fa-mobile-alt"></i><br>ĐIỆN THOẠI
            </div>
        </div>
    </div>

    <div id="login-screen" class="hidden">
        <div class="login-box">
            <h2 id="welcome-txt">KIMETSU NO VÂN</h2>
            <input type="password" id="password" placeholder="Mật khẩu của chúng mình...">
            <button id="start-btn" onclick="checkLogin()">VÀO THẾ GIỚI</button>
        </div>
    </div>

    <div id="game-ui" class="hidden">
        <div id="crosshair">+</div>
        <div id="hud">KÝ ỨC: <span id="frags">0</span>/10</div>
        <div id="msg-box"></div>
        <div id="mobile-btns" class="hidden">
            <div class="m-btn" onmousedown="attack()"><i class="fas fa-fist-raised"></i></div>
            <div class="m-btn" onmousedown="swing()"><i class="fas fa-anchor"></i></div>
        </div>
    </div>

    <audio id="snd-forest" src="forest.mp3" loop></audio>
    <audio id="snd-slash" src="slash.mp3"></audio>

    <script>
        let device = 'pc';
        let scene, camera, renderer, titan, katana, isLocked = false;
        let frags = 0, isGameOver = false;
        const keys = {};

        const cheers = [
            "Biết chơi rồi đó vợ của tổng tài! =)",
            "Á ĐU! Vip vậy ngầu quá vợ ơi!",
            "Tui yêu em, cố lên sắp được gặp anh rồi!",
            "Sắp đi được nửa đường rồi, tuyệt vời!",
            "Còn 5 thằng nữa thôi, cố lên nha vợ iu!",
            "Mãi đỉnh baby ơi, mãi đỉnh!",
            "ÔNG CỐ NỘI ƠI, CHÁU DÂU TUYỆT QUÁ!",
            "Sắp tới đích rồi vợ ơi, cố lên!",
            "90% rồi! Anh tin em làm được!",
            "Chúc mừng em! Đây là phần thưởng cho em ❤️"
        ];

        function setDevice(type) {
            device = type;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function checkLogin() {
            if(document.getElementById('password').value === "emyeubminhlam") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('game-ui').classList.remove('hidden');
                if(device === 'mobile') document.getElementById('mobile-btns').classList.remove('hidden');
                initGame();
            } else { alert("Mật khẩu sai rồi vợ ơi!"); }
        }

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);
            scene.fog = new THREE.FogExp2(0x020205, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Ánh sáng huyền ảo
            scene.add(new THREE.AmbientLight(0x4040ff, 0.3));
            const moon = new THREE.PointLight(0xffffff, 1.5, 500);
            moon.position.set(0, 100, -100);
            scene.add(moon);

            // Mặt đất nghệ thuật
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({color: 0x050505, roughness: 0.8}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            // Thêm "Cây tử đằng" lấp lánh
            for(let i=0; i<60; i++) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 10), new THREE.MeshStandardMaterial({color: 0x1a1a1a}));
                const bloom = new THREE.Mesh(new THREE.SphereGeometry(3, 8, 8), new THREE.MeshBasicMaterial({color: 0x8a2be2, transparent: true, opacity: 0.6}));
                bloom.position.y = 6;
                tree.add(trunk, bloom);
                tree.position.set(Math.random()*200-100, 5, Math.random()*200-100);
                scene.add(tree);
            }

            // Tạo Kiếm Nhật Katana (Lưỡi đen cán đỏ)
            createKatana();

            if(device === 'pc') {
                document.addEventListener('click', () => {
                    renderer.domElement.requestPointerLock();
                    attack();
                });
                document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === renderer.domElement);
                window.addEventListener('mousemove', (e) => {
                    if(isLocked) {
                        camera.rotation.y -= e.movementX * 0.002;
                        camera.rotation.x -= e.movementY * 0.002;
                    }
                });
            }

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            document.getElementById('snd-forest').play();
            spawnTitan();
            camera.position.set(0, 3, 10);
            animate();
        }

        function createKatana() {
            katana = new THREE.Group();
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.1, 2), new THREE.MeshStandardMaterial({color: 0x000000, metalness: 1}));
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5), new THREE.MeshStandardMaterial({color: 0x8b0000}));
            handle.rotation.x = Math.PI/2; handle.position.z = 1;
            katana.add(blade, handle);
            katana.position.set(0.6, -0.6, -1);
            camera.add(katana);
            scene.add(camera);
        }

        function spawnTitan() {
            if(titan) scene.remove(titan);
            titan = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({color: 0x222222});
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1, 6), mat);
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), mat); head.position.y = 3.5;
            const core = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({color: 0xff0000}));
            core.position.set(0, 1.5, 0.8); core.name = "TIM";
            titan.add(body, head, core);
            titan.position.set(Math.random()*40-20, 3, camera.position.z - 40);
            scene.add(titan);
        }

        function attack() {
            if(isGameOver) return;
            document.getElementById('snd-slash').play();
            katana.rotation.x = -Math.PI/4;
            setTimeout(() => katana.rotation.x = 0, 100);

            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObjects(titan.children);
            if(hits.length > 0 && hits[0].object.name === "TIM") killTitan();
        }

        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            // Di chuyển
            const speed = 0.2;
            if(keys['KeyW']) camera.translateZ(-speed);
            if(keys['KeyS']) camera.translateZ(speed);
            if(keys['KeyA']) camera.translateX(-speed);
            if(keys['KeyD']) camera.translateX(speed);

            // Titan đuổi theo
            const d = camera.position.distanceTo(titan.position);
            if(d < 40) { titan.lookAt(camera.position); titan.translateZ(0.12 + frags*0.02); }
            if(d < 4) { isGameOver = true; alert("Vân ơi! Anh sẽ bảo vệ em..."); location.reload(); }

            renderer.render(scene, camera);
        }

        function killTitan() {
            const msg = document.getElementById('msg-box');
            msg.innerText = cheers[frags];
            msg.style.opacity = 1;
            
            let s = 0;
            const t = setInterval(() => {
                titan.scale.multiplyScalar(0.85);
                titan.position.y += 0.5;
                if(++s > 15) {
                    clearInterval(t);
                    msg.style.opacity = 0;
                    frags++;
                    document.getElementById('frags').innerText = frags;
                    if(frags < 10) spawnTitan();
                    else alert("Vân ơi, em là tất cả của anh! ❤️");
                }
            }, 50);
        }
    </script>
</body>
</html>
