<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ETERNITY FOR VÂN ❤️</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        .hidden { display: none !important; }

        /* GIAO DIỆN ĐĂNG NHẬP SANG TRỌNG */
        #login-screen { 
            position: fixed; inset: 0; 
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px);
            padding: 60px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2);
            text-align: center; box-shadow: 0 0 100px rgba(0,0,0,0.5);
            max-width: 400px; width: 90%;
        }
        h1 { color: #fff; font-size: 24px; letter-spacing: 4px; margin-bottom: 10px; text-transform: uppercase; }
        .sub { color: #ff9f43; font-size: 14px; margin-bottom: 40px; opacity: 0.8; }
        input { 
            width: 100%; padding: 15px; margin-bottom: 25px; border-radius: 30px; border: none;
            background: rgba(255,255,255,0.9); text-align: center; font-size: 16px; box-sizing: border-box;
        }
        #start-btn { 
            width: 100%; padding: 15px; border-radius: 30px; border: none;
            background: #ff4757; color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        #start-btn:hover { background: #ff6b81; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,71,87,0.4); }

        /* UI TRONG GAME - TINH TẾ HƠN */
        #game-ui { position: fixed; inset: 0; pointer-events: none; z-index: 100; color: #fff; }
        #hud { position: absolute; top: 30px; left: 30px; font-size: 14px; letter-spacing: 2px; }
        #frags-count { font-size: 32px; font-weight: bold; color: #ff9f43; }
        
        /* THÔNG BÁO TỔNG TÀI - HIỆN GIỮA MÀN HÌNH */
        #cheer-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -150%);
            font-size: 24px; font-weight: bold; text-align: center; color: #fff;
            text-shadow: 0 0 20px #ff4757; width: 80%; transition: 0.5s; opacity: 0;
        }

        /* NÚT MOBILE - CHỈ HIỆN TRÊN ĐIỆN THOẠI */
        #mobile-controls { position: absolute; bottom: 40px; right: 40px; display: flex; gap: 20px; pointer-events: auto; }
        .m-btn { 
            width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.5); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px;
        }

        /* HIỆU ỨNG CHẾT */
        #death-screen { position: fixed; inset: 0; z-index: 10000; background: radial-gradient(circle, #4b0000 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        .restart { margin-top: 20px; padding: 12px 30px; border-radius: 20px; border: none; background: #fff; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>ETERNITY</h1>
            <div class="sub">Hành trình tìm lại ký ức cho Vân</div>
            <input type="password" id="password" placeholder="Mật khẩu của chúng mình...">
            <button id="start-btn" onclick="checkLogin()">KHỞI ĐẦU</button>
        </div>
    </div>

    <div id="game-ui" class="hidden">
        <div id="hud">
            KÝ ỨC ĐÃ TÌM THẤY<br>
            <span id="frags-count">00</span> / 10
        </div>
        <div id="cheer-msg">ĐANG KHỞI TẠO...</div>
        
        <div id="mobile-controls">
            <div class="m-btn" onmousedown="startSwing()" ontouchstart="startSwing()"><i class="fas fa-anchor"></i></div>
            <div class="m-btn" onmousedown="boost()" ontouchstart="boost()"><i class="fas fa-bolt"></i></div>
        </div>
    </div>

    <div id="death-screen" class="hidden">
        <h2>ANH SẼ KHÔNG ĐỂ EM RA ĐI...</h2>
        <button class="restart" onclick="location.reload()">HỒI SINH</button>
    </div>

    <audio id="snd-forest" src="forest.mp3" loop></audio>
    <audio id="snd-slash" src="slash.mp3"></audio>
    <audio id="snd-blood" src="blood.mp3"></audio>

    <script>
        // === BIẾN HỆ THỐNG ===
        let scene, camera, renderer, titan, katanaGroup, isSwinging = false;
        let targetPos = new THREE.Vector3(), frags = 0, isGameOver = false, boostReady = true;
        let walkCycle = 0, mouseX = 0, mouseY = 0;
        const keys = {};

        const cheers = [
            "Biết chơi rồi đó vợ của tổng tài! =)",
            "Á ĐU! Vip vậy ngầu quá vợ ơi!",
            "Ngưỡng mộ quá đi, tui yêu em cố lên!",
            "Sắp đi được nửa đường rồi, tuyệt vời!",
            "Còn 5 thằng nữa thôi, cố lên nha vợ iu!",
            "Mãi đỉnh baby ơi, mãi đỉnh!",
            "ÔNG CỐ NỘI ƠI, CHÁU DÂU TUYỆT QUÁ!",
            "Sắp tới đích rồi vợ ơi, cố lên!",
            "90% rồi! Anh tin em làm được!",
            "Chúc mừng em! Đây là phần thưởng cho em ❤️"
        ];

        function checkLogin() {
            if(document.getElementById('password').value === "emyeubminhlam") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('game-ui').classList.remove('hidden');
                initGame();
            } else { alert("Mật khẩu chưa đúng rồi vợ ơi!"); }
        }

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Ánh sáng lãng mạn
            const ambient = new THREE.AmbientLight(0x404040, 0.5); scene.add(ambient);
            const moonLight = new THREE.DirectionalLight(0x80a0ff, 1);
            moonLight.position.set(50, 100, 50);
            moonLight.castShadow = true;
            scene.add(moonLight);

            // Mặt đất có lưới (Grid) nhìn rất hiện đại
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI/2;
            ground.receiveShadow = true;
            scene.add(ground);

            const grid = new THREE.GridHelper(1000, 100, 0xff4757, 0x222222);
            grid.position.y = 0.01;
            scene.add(grid);

            // Tạo Kiếm Katana Anime
            createKatana();

            // Nhạc nền
            document.getElementById('snd-forest').volume = 0.2;
            document.getElementById('snd-forest').play();

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('mousemove', e => {
                if(!isGameOver) {
                    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
                }
            });

            spawnTitan();
            camera.position.set(0, 3, 10);
            animate();
        }

        function createKatana() {
            katanaGroup = new THREE.Group();
            const bladeMat = new THREE.MeshStandardMaterial({color: 0xffffff, metalness: 1, roughness: 0.1});
            const handleMat = new THREE.MeshStandardMaterial({color: 0xff0000});

            function makeSword(side) {
                const s = new THREE.Group();
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.08, 1.8), bladeMat);
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5), handleMat);
                handle.rotation.x = Math.PI/2;
                handle.position.z = 1;
                s.add(blade, handle);
                s.position.set(side * 0.8, -0.6, -1.2);
                s.rotation.y = -side * 0.1;
                return s;
            }

            katanaGroup.add(makeSword(-1), makeSword(1));
            camera.add(katanaGroup);
            scene.add(camera);
        }

        function spawnTitan() {
            if(titan) scene.remove(titan);
            titan = new THREE.Group();
            const skin = new THREE.MeshStandardMaterial({color: 0x3d3d3d});
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1, 6), skin);
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), skin);
            head.position.y = 3.5;
            const heart = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({color: 0xff4757}));
            heart.position.set(0, 1.5, 0.8); heart.name = "TIM";
            titan.add(body, head, heart);
            titan.position.set(Math.random()*40-20, 3, camera.position.z - 40);
            scene.add(titan);
        }

        function startSwing() {
            if(isGameOver) return;
            isSwinging = true;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            targetPos.copy(camera.position).addScaledVector(dir, 30);
        }

        function boost() {
            if(!boostReady || isGameOver) return;
            camera.position.addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 15);
            boostReady = false;
            setTimeout(() => boostReady = true, 3000);
        }

        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            // Điều khiển Camera bằng chuột
            camera.rotation.y = -mouseX * 0.5;
            camera.rotation.x = -mouseY * 0.3;

            // Di chuyển WASD
            const moveSpeed = 0.15;
            if(keys['KeyW']) camera.translateZ(-moveSpeed);
            if(keys['KeyS']) camera.translateZ(moveSpeed);
            if(keys['KeyA']) camera.translateX(-moveSpeed);
            if(keys['KeyD']) camera.translateX(moveSpeed);

            // Hiệu ứng Camera "Thở" và "Đi bộ"
            if(keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD']) {
                walkCycle += 0.15;
                camera.position.y = 3 + Math.sin(walkCycle) * 0.05;
                katanaGroup.position.y = Math.sin(walkCycle * 2) * 0.02;
            }

            const dist = camera.position.distanceTo(titan.position);
            if(dist < 30) { titan.lookAt(camera.position); titan.translateZ(0.1 + frags * 0.02); }
            if(dist < 4) gameOver();

            if(isSwinging) {
                camera.position.lerp(targetPos, 0.08);
                if(camera.position.distanceTo(targetPos) < 2) isSwinging = false;
            }

            renderer.render(scene, camera);
        }

        window.onclick = () => {
            if(isGameOver) return;
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObjects(titan.children);
            if(hits.length > 0 && hits[0].object.name === "TIM") {
                document.getElementById('snd-slash').play();
                killTitan();
            }
        };

        function killTitan() {
            const msg = document.getElementById('cheer-msg');
            msg.innerText = cheers[frags];
            msg.style.opacity = 1;
            
            let s = 0;
            const timer = setInterval(() => {
                titan.scale.multiplyScalar(0.85);
                titan.position.y += 0.4;
                if(++s > 15) {
                    clearInterval(timer);
                    msg.style.opacity = 0;
                    frags++;
                    document.getElementById('frags-count').innerText = frags < 10 ? '0'+frags : frags;
                    if(frags < 10) spawnTitan();
                    else alert("Vân ơi, em đã chiến thắng! Anh yêu em rất nhiều!");
                }
            }, 50);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('snd-blood').play();
            document.getElementById('death-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
